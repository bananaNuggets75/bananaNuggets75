name: Metrics

# Generates language/activity SVGs that INCLUDE private repositories, which no
# hosted widget can do. METRICS_TOKEN must be a classic PAT with the `repo`
# scope — that scope is the only reason private repos become visible here.
# The action commits the generated SVGs back to this repo, so the README
# references them by relative path and they can never rate-limit or 503.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Languages (all repos, private included)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bananaNuggets75
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recent
          # indepth clones each repo and runs linguist over real commit bytes
          # instead of GitHub's per-repo summary. This is what makes private
          # work count properly. Drop it if the job starts timing out.
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bananaNuggets75
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
